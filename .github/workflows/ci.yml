# PhiX — CI: Backend Postgres + Backend SQLite + Frontend-Build
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: noten_user
          POSTGRES_PASSWORD: noten_password
          POSTGRES_DB: notenauswertung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noten_user -d notenauswertung"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://noten_user:noten_password@localhost:5432/notenauswertung?schema=public

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Node)
        run: npm test

      - name: Prisma migrate (Postgres)
        run: npx prisma migrate deploy

      - name: Smoke (Postgres)
        run: node scripts/ci-smoke.js

  backend-sqlite:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci-smoke.sqlite

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Node)
        run: npm test

      - name: Prisma db push (SQLite)
        run: npx prisma db push --schema=prisma/sqlite/schema.prisma

      - name: Smoke (SQLite)
        run: node scripts/ci-smoke.js

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Notenauswertung-App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Notenauswertung-App/package-lock.json

      - name: Install & build
        run: npm ci && npm run build
