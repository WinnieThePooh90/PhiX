# Fester Projektname: „Herunterfahren“ im Backend-Container ruft
# docker compose … down mit derselben Datei auf – sonst passt der Name nicht
# (Host nutzt den Ordnernamen, im Container wäre es sonst nur „compose“).
name: phix

version: '3.8'

services:
  frontend:
    build:
      context: ./Notenauswertung-App
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-1990}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://noten_user:noten_password@db:5432/notenauswertung?schema=public
      - PHIX_DOCKER_SHUTDOWN=1
      - PHIX_COMPOSE_DIR=/compose
      - PHIX_COMPOSE_PROJECT_NAME=phix
      # Optional (nur bei leerer AppUser-Tabelle): - BOOTSTRAP_ADMIN_PASSWORD=…
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: noten_user
      POSTGRES_PASSWORD: noten_password
      POSTGRES_DB: notenauswertung
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
